services:
  api:
    build: .
    image: archaeo-strata-api:latest
    container_name: archaeo-strata-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/archaeo.db
    volumes:
      - archaeo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sqlite3; sqlite3.connect(os.environ['DB_PATH']).execute('SELECT 1 FROM meta')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archaeo-data:
